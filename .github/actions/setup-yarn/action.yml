name: Set up Node and Yarn
description: Node from .nvmrc, Yarn from packageManager (via Corepack), cached Yarn packages and an immutable install.

runs:
  using: composite
  steps:
    - name: Set up Node (version from .nvmrc)
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        # Yarn only exists after Corepack is enabled below, so the cache is handled separately.
        package-manager-cache: false

    - name: Enable Corepack (Yarn from packageManager)
      shell: bash
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      run: |
        npm install -g corepack
        corepack enable
        yarn --version

    - name: Get Yarn cache directory
      id: yarn-cache
      shell: bash
      run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

    - name: Cache Yarn packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.yarn-cache.outputs.dir }}
        key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
        restore-keys: yarn-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: yarn install --immutable
