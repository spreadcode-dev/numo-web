name: Sync main into develop

on:
  push:
    branches: [main]

permissions: {}

# Queue instead of running in parallel, so two pushes can't both open a PR.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  open-sync-pr:
    name: open-sync-pr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout (full history to compare main and develop)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Open a main → develop PR if develop is behind
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/open-sync-pr.sh "$(jq -r .version package.json)"
